<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkCode — nossos projetos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="nodes" aria-hidden="true"></canvas>

<main class="wrap">

    <div class="brand">
        <div class="mark" aria-hidden="true">&lt;/&gt;</div>
        <h1 class="wordmark">Link<span>Code</span></h1>
        <p class="tagline">Tudo o que estamos construindo, reunido aqui.</p>
    </div>

    <nav class="links" aria-label="Links do LinkCode">
        <a href="SITE.HTML" class="link-row">
            <span class="link-text">
                <span class="link-title">Nexus</span>
                <span class="link-meta">visão geral do projeto</span>
            </span>
            <span class="node" aria-hidden="true">
                <span class="bar b1"></span>
                <span class="bar b2"></span>
            </span>
        </a>

        <a href="https://livrariapaginas.netlify.app" class="link-row" target="_blank" rel="noopener">
            <span class="link-text">
                <span class="link-title">Livraria Páginas</span>
                <span class="link-meta">livrariapaginas.netlify.app</span>
            </span>
            <span class="node" aria-hidden="true">
                <span class="bar b1"></span>
                <span class="bar b2"></span>
            </span>
        </a>

        <a href="https://calculadorasmart.netlify.app" class="link-row" target="_blank" rel="noopener">
            <span class="link-text">
                <span class="link-title">Calculadora Smart</span>
                <span class="link-meta">calculadorasmart.netlify.app</span>
            </span>
            <span class="node" aria-hidden="true">
                <span class="bar b1"></span>
                <span class="bar b2"></span>
            </span>
        </a>
    </nav>

    <footer class="foot">
        <span>© 2026 LinkCode</span>
    </footer>

</main>

<script src="script.js"></script>
</body>
</html>
